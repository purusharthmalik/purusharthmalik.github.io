<svg viewBox="0 0 720 230" role="img" aria-label="Three places an observer can look: the activations inside the loop, the written reasoning, and the final message. Each has its own kind of monitor."><defs><marker id="ink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect x="10" y="62" width="104" height="70" rx="6" fill="#eee9dd"/><text x="62" y="92" class="label" text-anchor="middle">Prompt</text><text x="62" y="114" class="small" text-anchor="middle">same facts,</text><text x="62" y="129" class="small" text-anchor="middle">two bonuses</text><rect x="146" y="62" width="160" height="70" rx="6" fill="#d8eae2"/><text x="226" y="92" class="label" text-anchor="middle">① Inside the loop</text><text x="226" y="114" class="small" text-anchor="middle">activations h₁, h₂, h₃</text><rect x="338" y="62" width="160" height="70" rx="6" fill="#d8eae2"/><text x="418" y="92" class="label" text-anchor="middle">② Reasoning trace</text><text x="418" y="114" class="small" text-anchor="middle">thinking-channel text</text><rect x="530" y="62" width="180" height="70" rx="6" fill="#d8eae2"/><text x="620" y="92" class="label" text-anchor="middle">③ Final message</text><text x="620" y="114" class="small" text-anchor="middle">the letter Y (A or B)</text><line x1="116" y1="97" x2="143" y2="97" stroke="#718281" stroke-width="1.5" marker-end="url(#ink-arrow)"/><line x1="308" y1="97" x2="335" y2="97" stroke="#718281" stroke-width="1.5" marker-end="url(#ink-arrow)"/><line x1="500" y1="97" x2="527" y2="97" stroke="#718281" stroke-width="1.5" marker-end="url(#ink-arrow)"/><text x="226" y="40" class="small" text-anchor="middle">no tokens written yet</text><text x="418" y="40" class="small" text-anchor="middle">optional, can be skipped</text><text x="620" y="40" class="small" text-anchor="middle">what the listener sees</text><line x1="226" y1="134" x2="226" y2="160" stroke="#718281" stroke-width="1"/><line x1="418" y1="134" x2="418" y2="160" stroke="#718281" stroke-width="1"/><line x1="620" y1="134" x2="620" y2="160" stroke="#718281" stroke-width="1"/><text x="226" y="182" class="teal" text-anchor="middle">linear probe</text><text x="418" y="182" class="teal" text-anchor="middle">word counts · LLM judge</text><text x="620" y="182" class="teal" text-anchor="middle">answer-only · grounded reader</text><text x="226" y="204" class="small" text-anchor="middle">“which bonus?”</text><text x="418" y="204" class="small" text-anchor="middle">“which bonus?”</text><text x="620" y="204" class="small" text-anchor="middle">“was the listener misled?”</text></svg>
