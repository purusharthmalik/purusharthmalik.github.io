<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  {%- include head.html -%}
  {%- for s in page.scripts %}
  <script src="{{ s | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  {%- endfor %}
</head>
<body class="{{ page.body_class | default: 'page' }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {%- include header.html -%}
  <main id="main">
    {{ content }}
  </main>
  {%- include footer.html -%}
</body>
</html>
